    <body>
        <div>
            <div>
            <header>

                <nav>
                    <a href="Páginaprincipal.html">Principal</a>

                </nav>
            </header>
        </div>
        <main>
            <form>
                <h1 align="center">Bienvenido</h1>
                <h2 align="center">Información del Cliente</h2>
                <fieldset>
                    <legend>NOMBRE</legend>
                    <p>
                        <label>Nombres</label>
                        <input type="text" id="nombres" name="nombres" required>
                    </p>
                    <p>
                        <label>Apellidos</label>
                        <input type="text" id="apellidos" name="apellidos" required>
                    </p>
                </fieldset>
                <fieldset>
                    <legend>CORREO ELECTRÓNICO</legend>
                    <p>
                        <label>Correo Electrónico</label>
                        <input type="email" id="correo" name="correo" required>
                    </p>
                </fieldset>
                <fieldset>
                    <legend>TELÉFONO</legend>
                    <p>
                        <label>Teléfono</label>
                        <input type="tel" id="telefono" name="telefono">
                    </p>
                </fieldset>
                <h2 align="center">Detalles de la Cita</h2>
                <fieldset>
                    <legend>TIPO DE SESIÓN</legend>
                    <p>
                        <label>Sesión</label>
                        <select id="sesion" name="sesion" required>
                            <option>Individual</option>
                            <option>Pareja</option>
                            <option>Familiar</option>
                            <option>Eventos</option>
                        </select>
                    </p>
                </fieldset>
                <fieldset>
                    <legend>SI NECESITA FOTOGRAFÍAS PARA UNA FECHA EN ESPECÍFICA, INTRODÚZCALA AQUÍ.</legend>
                    <p>
                        <label>Fecha:</label>
                        <input type="date" id="fecha" name="fecha">
                    </p>
                </fieldset>
                <fieldset>
                    <legend>¿COMÓ SUPISTE SOBRE NOSOTROS?</legend>
                    <p>
                        <textarea id="referencia" rows="4" cols="100"></textarea>
                    </p>
                </fieldset>
                <br>
                <button type="submit" class="submit-btn">Enviar</button>
            </form>
        </main>
